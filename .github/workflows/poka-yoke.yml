name: Poka-Yoke CI Gate

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  security-and-quality-gate:
    name: Security and Quality Gate
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # GATE 1: Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # GATE 2: Terraform formatting
      # --------------------------------------------------
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      # --------------------------------------------------
      # GATE 3: Terraform validation
      # --------------------------------------------------
      - name: Terraform initialization
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validation
        working-directory: terraform
        run: terraform validate

      # --------------------------------------------------
      # GATE 4: Secret detection
      # --------------------------------------------------
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # GATE 5: Python linting
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Ruff
        run: pip install ruff

      - name: Python lint check
        run: ruff check django_app

      - name: Django tests
        run: python manage.py test django_app

      # --------------------------------------------------
      # FINAL GATE
      # --------------------------------------------------
      - name: Poka-Yoke gate passed
        run: |
          echo "All mandatory security and quality gates passed."
          echo "Build is approved to continue."
